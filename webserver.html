<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On-Off Slider</title>
</head>
<body>
  <label class="switch" for="pref" data-state="off">
    <input type="checkbox" id="pref" name="pref" />
    <div class="toggle">
      <div class="spinner"></div>
    </div>
  </label>

  <div class="test-controls" aria-label="test controls">
    <button type="button" id="btn-load">Load</button>
    <button type="button" id="btn-on">On</button>
    <button type="button" id="btn-off">Off</button>
    <button type="button" id="btn-disconnected">Disconnected</button>
  </div>

  <script>
    const toggleSwitches = [...document.querySelectorAll('.switch')];
    const primarySwitch = document.querySelector('.switch');

    function applyRemoteState(state) {
      if (state === 'loading') {
        primarySwitch.classList.add('loading');
        return;
      }

      primarySwitch.classList.remove('loading');
      applyState(primarySwitch, state.toLowerCase());
    }
 
    function applyState(toggleSwitch, state) {
      const checkbox = toggleSwitch.querySelector('input[type="checkbox"]');
      toggleSwitch.dataset.state = state;
      checkbox.checked = state === 'on';
      checkbox.indeterminate = state === 'disconnected';
    }

    async function getJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });

      let payload = {};
      try {
        payload = await response.json();
      } catch (error) {
        payload = {};
      }

      if (!response.ok) {
        const message = payload.error || `${response.status} ${response.statusText}`;
        throw new Error(message);
      }

      return payload;
    }

    async function sendPower(value) {
      try {
        await getJson('/api/power', {
          method: 'POST',
          body: JSON.stringify({ value })
        });
      } catch (error) {
        console.error('Error sending power state:', error);
      }
    }

    toggleSwitches.forEach((toggleSwitch) => {
      toggleSwitch.addEventListener('click', (e) => {
        e.preventDefault();
        if (toggleSwitch.classList.contains('loading')) {
          return;
        }
        const currentState = toggleSwitch.dataset.state || 'disconnected';
        if (currentState === 'on') {
          toggleSwitch.classList.add('loading');
          sendPower("OFF");
        } else if (currentState === 'off') {
          toggleSwitch.classList.add('loading');
          sendPower("ON");
        }
      });
    });
    const loadButton = document.getElementById('btn-load');
    const onButton = document.getElementById('btn-on');
    const offButton = document.getElementById('btn-off');
    const disconnectedButton = document.getElementById('btn-disconnected');

    loadButton.addEventListener('click', () => {
      sendPower("LOADING");
    });

    onButton.addEventListener('click', () => {
      sendPower("ON");
    });

    offButton.addEventListener('click', () => {
      sendPower("OFF");
    });

    disconnectedButton.addEventListener('click', () => {
      sendPower("DISCONNECTED");
    });

    function waitLoop() {
      applyState(primarySwitch, 'disconnected');
      primarySwitch.classList.add('loading');
      const eventSource = new EventSource('/api/events');

      eventSource.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload.state) {
            applyRemoteState(payload.state);
          }
        } catch (error) {
          console.error('Error parsing event stream payload:', error);
        }
      };

      eventSource.onerror = () => {
        primarySwitch.classList.add('loading');
      };

      return eventSource;
    }

    waitLoop();
  </script>

  <style>
    :root {
      --blue: #007aff;
      --green: #4bd964;
      --orange: #ff9500;
      --disabled: #9ba2b5;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100vh;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      justify-content: center;
      align-items: center;
    }

    .test-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .test-controls button {
      border: 1px solid #c7cbd4;
      border-radius: 0.375rem;
      background: #ffffff;
      padding: 0.4rem 0.75rem;
      font: inherit;
      cursor: pointer;
    }

    .test-controls button:hover {
      background: #f5f7fa;
    }

    .switch {
      position: relative;
      display: flex;
      align-items: center;
      width: 4rem;
      height: 2rem;
      border-radius: 1.5rem;
      background-color: #f4f5f8;
      box-shadow: inset 0 0 8px rgba(180, 180, 180, 0.4);
      cursor: pointer;
    }

    .switch input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      top: -20px;
      pointer-events: none;
    }

    .switch.loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .toggle {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      transition: width 250ms ease-out, left 250ms ease-out;
    }

    .switch input[type="checkbox"]:focus ~ .toggle {
      outline-offset: 0.125rem;
    }

    .switch.loading input[type="checkbox"]:not(:checked) ~ .toggle {
      width: 2rem;
      background: var(--disabled);
    }

    .switch.loading input[type="checkbox"]:checked:focus ~ .toggle,
    .switch.loading input[type="checkbox"]:not(:checked):focus ~ .toggle {
      outline: 0.25rem solid var(--disabled);
    }

    .switch.loading input[type="checkbox"]:checked ~ .toggle {
      width: 2rem;
      left: calc(100% - 2rem);
      background: var(--disabled);
    }

    .switch[data-state="off"] .toggle {
      left: 0;
      background: var(--orange);
    }

    .switch[data-state="on"] .toggle {
      left: calc(100% - 2rem);
      background: var(--green);
    }

    .switch[data-state="disconnected"] .toggle {
      left: calc(50% - 1rem);
      background: var(--disabled);
    }

    .switch[data-state="off"]:focus-within .toggle {
      outline: 0.25rem solid var(--orange);
    }

    .switch[data-state="on"]:focus-within .toggle {
      outline: 0.25rem solid var(--green);
    }

    .switch[data-state="disconnected"]:focus-within .toggle {
      outline: 0.25rem solid var(--disabled);
    }

    .switch.loading[data-state="disconnected"] .toggle {
      width: 2rem;
      left: calc(50% - 1rem);
      background: var(--disabled);
    }

    .spinner {
      opacity: 0;
      width: 1.25rem;
      height: 1.25rem;
      border: 0.25rem solid white;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotate 1s linear infinite;
    }

    .switch.loading .spinner {
      opacity: 1;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</body>
</html>
